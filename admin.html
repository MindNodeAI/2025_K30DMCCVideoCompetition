<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主辦單位管理後台 - 2050 永續生活</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 登入畫面 -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900">
        <div class="bg-white p-10 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <i class="fa-solid fa-shield-halved text-5xl text-slate-800 mb-6"></i>
            <h1 class="text-2xl font-black mb-2">主辦單位後台</h1>
            <p class="text-slate-500 mb-8 text-sm">請使用已授權的 Google 帳號登入</p>
            <button id="googleLoginBtn" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-3 px-4 rounded-xl shadow-sm mb-4">
                <i class="fa-brands fa-google text-red-500 mr-2"></i> 使用 Google 登入
            </button>
            <div id="loginErrorMsg" class="hidden mt-4 text-red-500 text-sm font-bold"></div>
        </div>
    </div>

    <!-- 後台主畫面 -->
    <div id="dashboardScreen" class="hidden flex flex-col h-full w-full">
        <!-- 頂部導覽列 -->
        <header class="bg-slate-900 text-white shadow-md flex justify-between items-center px-6 py-4 shrink-0">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-leaf text-emerald-400 text-xl"></i>
                <h1 class="font-bold text-lg hidden sm:block">競賽管理中心</h1>
            </div>
            
            <!-- 分頁按鈕 -->
            <div class="flex space-x-1 bg-slate-800 p-1 rounded-lg">
                <button onclick="switchTab('tab-registrations')" class="tab-btn active px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-bold bg-slate-700 text-white transition">報名管理</button>
                <button onclick="switchTab('tab-judges')" class="tab-btn px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-bold text-slate-400 hover:text-white transition">評審管理</button>
                <button onclick="switchTab('tab-scores')" class="tab-btn px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-bold text-slate-400 hover:text-white transition">評分統計</button>
            </div>

            <div class="flex items-center space-x-4">
                <span id="adminEmail" class="text-xs md:text-sm text-slate-300 hidden md:inline-block">admin@email.com</span>
                <button id="logoutBtn" class="text-slate-400 hover:text-white text-sm transition"><i class="fa-solid fa-sign-out-alt"></i> 登出</button>
            </div>
        </header>

        <!-- 內容區 -->
        <main class="flex-1 overflow-hidden relative">
            
            <!-- Tab 1: 報名管理 -->
            <div id="tab-registrations" class="tab-content h-full p-4 md:p-6 flex flex-col">
                <div class="flex justify-between items-end mb-4 shrink-0">
                    <div>
                        <h2 class="text-xl md:text-2xl font-black text-slate-800">報名資料列表</h2>
                        <p class="text-slate-500 text-sm">目前總報名數：<span id="totalCount" class="font-bold text-emerald-600">0</span> 隊</p>
                    </div>
                    <button id="refreshBtn" class="bg-white border border-slate-300 px-3 md:px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-50 shadow-sm transition">
                        <i class="fa-solid fa-rotate-right mr-1"></i> 重新整理
                    </button>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 sticky top-0">
                                <tr>
                                    <th class="p-4 font-bold">報名時間</th>
                                    <th class="p-4 font-bold">組別</th>
                                    <th class="p-4 font-bold">作品名稱</th>
                                    <th class="p-4 font-bold">學校 / 代表人</th>
                                    <th class="p-4 font-bold text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-100">
                                <!-- Data rows go here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Tab 2: 評審管理 -->
            <div id="tab-judges" class="tab-content h-full p-4 md:p-6 flex flex-col hidden">
                <h2 class="text-xl md:text-2xl font-black text-slate-800 mb-6">評審名單管理</h2>
                
                <!-- 新增評審表單 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6 shrink-0">
                    <h3 class="font-bold text-slate-700 mb-3"><i class="fa-solid fa-user-plus mr-2 text-blue-500"></i>新增評審與指派組別</h3>
                    <form id="addJudgeForm" class="flex flex-col md:flex-row gap-4 items-end">
                        <div class="flex-1 w-full">
                            <label class="text-xs text-slate-500 font-bold block mb-1">評審 Google 信箱 <span class="text-red-500">*</span></label>
                            <input type="email" id="judgeEmail" required class="w-full p-2 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="judge@gmail.com">
                        </div>
                        <div class="flex-1 w-full">
                            <label class="text-xs text-slate-500 font-bold block mb-1">評審姓名/稱呼 <span class="text-red-500">*</span></label>
                            <input type="text" id="judgeName" required class="w-full p-2 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="例如：李教授">
                        </div>
                        <div class="flex-1 w-full">
                            <label class="text-xs text-slate-500 font-bold block mb-1">負責組別分配 <span class="text-red-500">*</span></label>
                            <select id="judgeGroup" class="w-full p-2 border border-slate-300 rounded outline-none focus:border-blue-500 bg-white">
                                <option value="全部">全部組別 (大專 + 高中職)</option>
                                <option value="大專校院組">僅限 大專校院組</option>
                                <option value="高中職組">僅限 高中職組</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition shadow-sm">新增</button>
                    </form>
                </div>

                <!-- 評審列表 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 sticky top-0">
                                <tr>
                                    <th class="p-4 font-bold">Google 登入信箱</th>
                                    <th class="p-4 font-bold">評審姓名</th>
                                    <th class="p-4 font-bold">負責組別</th>
                                    <th class="p-4 font-bold text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="judgesTableBody" class="divide-y divide-slate-100">
                                <!-- Judges go here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Tab 3: 評分統計 -->
            <div id="tab-scores" class="tab-content h-full p-4 md:p-6 flex flex-col hidden">
                <h2 class="text-xl md:text-2xl font-black text-slate-800 mb-6">即時評分排行與明細</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 sticky top-0">
                                <tr>
                                    <th class="p-4 font-bold text-center">總排名</th>
                                    <th class="p-4 font-bold">作品名稱</th>
                                    <th class="p-4 font-bold">組別</th>
                                    <th class="p-4 font-bold text-center">已評人數</th>
                                    <th class="p-4 font-bold text-right">平均總分</th>
                                    <th class="p-4 font-bold text-center">評分明細</th>
                                </tr>
                            </thead>
                            <tbody id="rankingTableBody" class="divide-y divide-slate-100">
                                <!-- Ranking go here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- 報名資料詳情 Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 shrink-0">
                <h3 class="font-black text-lg text-slate-800" id="modalProjName">作品名稱</h3>
                <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="text-slate-400 hover:text-red-500 text-xl transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 text-sm text-slate-700 space-y-5" id="modalContent">
                <!-- Data populated here -->
            </div>
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 shrink-0 flex justify-end gap-3" id="modalFooter">
                <!-- Links populated here -->
            </div>
        </div>
    </div>

    <!-- 評分明細詳情 Modal -->
    <div id="scoreDetailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-emerald-50 shrink-0">
                <h3 class="font-black text-lg text-emerald-800"><i class="fa-solid fa-magnifying-glass-chart mr-2"></i>評分明細：<span id="scoreModalProjName"></span></h3>
                <button onclick="document.getElementById('scoreDetailModal').classList.add('hidden')" class="text-slate-400 hover:text-red-500 text-xl transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-left text-sm border-collapse min-w-[700px]">
                    <thead class="bg-slate-100 text-slate-700">
                        <tr>
                            <th class="p-3 border border-slate-200 whitespace-nowrap">評審老師</th>
                            <th class="p-3 border border-slate-200 text-center whitespace-nowrap">主題(20)</th>
                            <th class="p-3 border border-slate-200 text-center whitespace-nowrap">行銷(20)</th>
                            <th class="p-3 border border-slate-200 text-center whitespace-nowrap">創意(15)</th>
                            <th class="p-3 border border-slate-200 text-center whitespace-nowrap">剪輯(20)</th>
                            <th class="p-3 border border-slate-200 text-center whitespace-nowrap">AI(25)</th>
                            <th class="p-3 border border-slate-200 text-center font-bold text-emerald-600 whitespace-nowrap">總分</th>
                            <th class="p-3 border border-slate-200 w-1/3">評語回饋</th>
                        </tr>
                    </thead>
                    <tbody id="scoreModalContent">
                        <!-- Score details injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 引入與主邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAEYCvKa3INWFyfkx8x7Lnb4f1GwyZzJI",
            authDomain: "k30-2050-video-competition.firebaseapp.com",
            projectId: "k30-2050-video-competition",
            storageBucket: "k30-2050-video-competition.firebasestorage.app",
            messagingSenderId: "757544431326",
            appId: "1:757544431326:web:4885078737a81f14fe9c4f",
            measurementId: "G-65ZP33NM0D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const allowedAdmins = ["mindnodeai@gmail.com", "ishareping@gmail.com"];
        
        let allRegistrations = [];
        let allScores = [];

        // --- UI Tabs 頁籤切換邏輯 ---
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            
            const targetTab = document.getElementById(tabId);
            if (targetTab) {
                targetTab.classList.remove('hidden');
            }
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-bold text-slate-400 hover:text-white transition';
            });
            event.target.className = 'tab-btn active px-3 md:px-4 py-1.5 rounded-md text-xs md:text-sm font-bold bg-slate-700 text-white transition';
            
            if(tabId === 'tab-judges') loadJudges();
            if(tabId === 'tab-scores') loadScoresAndRank();
        };

        // --- 登入邏輯 ---
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert("登入失敗：" + error.message); }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (allowedAdmins.includes(user.email)) {
                    enterDashboard(user.email);
                    loadRegistrations(); // 從 Firestore 讀取真實資料
                } else {
                    signOut(auth);
                    document.getElementById('loginErrorMsg').textContent = "權限不足：您不是系統管理員。若您是評審，請至評審專用入口登入。";
                    document.getElementById('loginErrorMsg').classList.remove('hidden');
                }
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('dashboardScreen').classList.add('hidden');
            }
        });

        function enterDashboard(email) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('adminEmail').textContent = email;
        }

        // --- [Tab 1] 報名管理資料讀取 ---
        async function loadRegistrations() {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="text-center p-6 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>資料載入中...</td></tr>';
            try {
                const querySnapshot = await getDocs(query(collection(db, "registrations"), orderBy("agreements.timestamp", "desc")));
                allRegistrations = [];
                querySnapshot.forEach((doc) => {
                    allRegistrations.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            } catch (error) {
                alert("讀取報名資料失敗：" + error.message);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadRegistrations();
        });

        // --- 檢查缺件邏輯 ---
        function getMissingItems(proj) {
            let missing = [];
            const data = proj;
            const files = proj.files || {};
            if (!data.projectDetails?.description || !data.projectDetails?.targetAudience || !data.projectDetails?.coreMessage || !data.projectDetails?.cta) missing.push("企劃內容簡介與行銷設定");
            if ((data.aiData?.typesUsed?.length || 0) < 2) missing.push("AI 技術勾選不足 2 類");
            if ((data.aiData?.records?.length || 0) < 3) missing.push("AI 使用紀錄未填滿 3 組");
            if (!data.videoDelivery?.length || !data.videoDelivery?.youtubeLink) missing.push("YouTube 連結與影片長度");
            if (!files.videoUrl) missing.push("MP4 影音原始檔");
            if (!files.presentationUrl) missing.push("15 頁作品介紹簡報 PDF");
            if (!files.studentIdUrl) missing.push("全體隊員學生證/在學證明");
            return missing;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            document.getElementById('totalCount').textContent = allRegistrations.length;

            allRegistrations.forEach(reg => {
                const date = reg.agreements?.timestamp ? new Date(reg.agreements.timestamp.seconds ? reg.agreements.timestamp.seconds * 1000 : reg.agreements.timestamp).toLocaleDateString() : '未知';
                
                // 判斷缺件狀態
                const missing = getMissingItems(reg);
                let statusBadge = '';
                if(missing.length === 0) {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold"><i class="fa-solid fa-check-circle mr-1"></i>資料齊全</span>`;
                } else {
                    statusBadge = `<span class="bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-bold shadow-sm"><i class="fa-solid fa-triangle-exclamation mr-1"></i>缺件 (${missing.length})</span>`;
                }
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-4 text-slate-500">${date}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4"><span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-bold">${reg.groupCategory}</span></td>
                    <td class="p-4 font-bold text-slate-800">${reg.projectName}</td>
                    <td class="p-4">${reg.team?.school} / ${reg.team?.captainName}</td>
                    <td class="p-4 text-center">
                        <button class="view-btn bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1 rounded-lg hover:bg-emerald-100 transition font-bold shadow-sm" data-id="${reg.id}">
                            <i class="fa-solid fa-eye mr-1"></i>查看詳情
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => showDetail(e.currentTarget.getAttribute('data-id')));
            });
        }

        // 顯示報名資料詳情 (Modal)
        function showDetail(id) {
            const reg = allRegistrations.find(r => r.id === id);
            if(!reg) return;

            document.getElementById('modalProjName').textContent = reg.projectName;
            
            // 缺件警告區塊
            const missing = getMissingItems(reg);
            let missingWarning = '';
            if (missing.length > 0) {
                missingWarning = `
                    <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 mb-4 shadow-sm">
                        <h4 class="font-bold text-amber-900 mb-1 flex items-center"><i class="fa-solid fa-triangle-exclamation text-amber-500 mr-2"></i>系統提示：此作品資料尚未繳齊</h4>
                        <ul class="text-xs text-amber-800 font-bold list-disc list-inside mt-2">
                            ${missing.map(m => `<li>${m}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            const membersHtml = (reg.team?.members || []).map(m => `<li class="mb-1"><span class="font-bold text-slate-700">${m.role}：</span>${m.name} <span class="text-slate-500">(${m.school} ${m.department})</span></li>`).join('');
            const teachersHtml = (reg.team?.teachers || []).map(t => `<li class="mb-1">${t.name} <span class="text-slate-500">(${t.school})</span></li>`).join('');
            
            const aiHtml = (reg.aiData?.records || []).map((r, i) => `
                <div class="mb-3 bg-slate-100 p-3 rounded-lg border border-slate-200">
                    <strong class="text-slate-800">${i+1}. ${r.tool} <span class="text-xs text-blue-600 font-normal bg-blue-100 px-1 rounded ml-1">${r.type}</span></strong><br>
                    <div class="mt-1"><span class="text-xs text-slate-500 font-bold">Prompt:</span> ${r.prompt}</div>
                    <div class="mt-1"><span class="text-xs text-slate-500 font-bold">用途:</span> ${r.usage}</div>
                </div>
            `).join('');

            document.getElementById('modalContent').innerHTML = `
                ${missingWarning}
                <div class="grid grid-cols-2 gap-4 mb-2">
                    <div class="bg-white border border-slate-200 p-3 rounded-xl shadow-sm"><strong class="block mb-1 text-slate-400 text-xs">參賽組別</strong><span class="font-bold text-blue-600">${reg.groupCategory}</span></div>
                    <div class="bg-white border border-slate-200 p-3 rounded-xl shadow-sm"><strong class="block mb-1 text-slate-400 text-xs">隊長簽名</strong><span class="font-bold text-slate-700">${reg.agreements?.signature}</span></div>
                </div>
                
                <h4 class="font-bold text-slate-800 border-b-2 border-emerald-100 pb-1 mt-4">團隊成員</h4>
                <ul class="pl-2">${membersHtml}</ul>
                
                <h4 class="font-bold text-slate-800 border-b-2 border-blue-100 pb-1 mt-4">指導老師</h4>
                <ul class="pl-2">${teachersHtml}</ul>

                <h4 class="font-bold text-slate-800 border-b-2 border-amber-100 pb-1 mt-4">影音企劃內容</h4>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <p class="mb-3"><strong>作品簡介：</strong><br>${reg.projectDetails?.description}</p>
                    <p class="mb-2"><strong>目標受眾 (TA)：</strong>${reg.projectDetails?.targetAudience}</p>
                    <p class="mb-2"><strong>核心訊息：</strong>${reg.projectDetails?.coreMessage}</p>
                    <p><strong>行動呼籲 (CTA)：</strong>${reg.projectDetails?.cta}</p>
                </div>

                <h4 class="font-bold text-slate-800 border-b-2 border-purple-100 pb-1 mt-4">生成式 AI 使用紀錄</h4>
                <p class="text-xs mb-3 font-bold text-purple-600">技術類型：${(reg.aiData?.typesUsed || []).join(', ')}</p>
                ${aiHtml}
            `;

            const ytLink = reg.videoDelivery?.youtubeLink || '#';
            const vidUrl = reg.files?.videoUrl || '#';
            const idUrl = reg.files?.studentIdUrl || '#';
            const presentationUrl = reg.files?.presentationUrl || '#';

            document.getElementById('modalFooter').innerHTML = `
                <a href="${idUrl}" target="_blank" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-300 transition shadow-sm"><i class="fa-solid fa-id-card mr-1"></i> 檢視學生證</a>
                <a href="${presentationUrl}" target="_blank" class="bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-100 transition shadow-sm"><i class="fa-regular fa-file-pdf mr-1"></i> 作品簡報</a>
                <a href="${vidUrl}" target="_blank" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-700 transition shadow-sm"><i class="fa-solid fa-download mr-1"></i> MP4 原檔</a>
                <a href="${ytLink}" target="_blank" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-100 transition shadow-sm"><i class="fa-brands fa-youtube mr-1"></i> YouTube</a>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        // --- [Tab 2] 評審管理邏輯 ---
        document.getElementById('addJudgeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('judgeEmail').value;
            const name = document.getElementById('judgeName').value;
            const group = document.getElementById('judgeGroup').value;
            
            try {
                await setDoc(doc(db, "judges", email), { email: email, name: name, group: group, addedAt: new Date() });
                document.getElementById('addJudgeForm').reset();
                alert("新增評審成功！");
                loadJudges();
            } catch (error) { alert("新增失敗: " + error.message); }
        });

        async function loadJudges() {
            const tbody = document.getElementById('judgesTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>載入中...</td></tr>';
            try {
                const snap = await getDocs(collection(db, "judges"));
                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    let groupBadge = `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-bold">全部組別</span>`;
                    if(data.group === '大專校院組') groupBadge = `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">大專校院組</span>`;
                    if(data.group === '高中職組') groupBadge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold">高中職組</span>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 border-b border-slate-100">
                            <td class="p-4 text-slate-600">${data.email}</td>
                            <td class="p-4 font-bold text-slate-800">${data.name}</td>
                            <td class="p-4">${groupBadge}</td>
                            <td class="p-4 text-center">
                                <button class="text-red-400 hover:text-red-600 bg-red-50 p-2 rounded transition" onclick="deleteJudge('${data.email}')"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { alert("讀取評審名單失敗"); }
        }

        window.deleteJudge = async function(email) {
            if(!confirm(`確定移除評審權限：${email} 嗎？`)) return;
            try { await deleteDoc(doc(db, "judges", email)); loadJudges(); } catch (e) { alert("刪除失敗"); }
        };

        // --- [Tab 3] 評分統計與排名邏輯 ---
        async function loadScoresAndRank() {
            const tbody = document.getElementById('rankingTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>計算排名中...</td></tr>';
            
            try {
                const snap = await getDocs(collection(db, "scores"));
                allScores = [];
                snap.forEach(doc => allScores.push(doc.data()));
            } catch(e) { alert("讀取評分紀錄失敗"); return; }
            
            const projectStats = {};
            allScores.forEach(score => {
                if(!projectStats[score.projectId]) {
                    projectStats[score.projectId] = { count: 0, total: 0, name: score.projectName, group: "未知", scores: [] };
                }
                projectStats[score.projectId].count++;
                projectStats[score.projectId].total += score.totalScore;
                projectStats[score.projectId].scores.push(score);
            });

            Object.keys(projectStats).forEach(pid => {
                const reg = allRegistrations.find(r => r.id === pid);
                if(reg) projectStats[pid].group = reg.groupCategory;
            });

            const rankArray = Object.keys(projectStats).map(id => {
                const stat = projectStats[id];
                return { 
                    id, name: stat.name, group: stat.group, count: stat.count, 
                    avg: (stat.total / stat.count).toFixed(2), detailScores: stat.scores 
                };
            });

            rankArray.sort((a, b) => b.avg - a.avg);
            tbody.innerHTML = '';
            if(rankArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">目前尚無任何評分紀錄。</td></tr>';
                return;
            }

            rankArray.forEach((r, idx) => {
                let badge = `<span class="text-slate-400 font-bold bg-slate-100 px-2 py-1 rounded">第 ${idx+1} 名</span>`;
                if(idx === 0) badge = `<span class="text-amber-600 font-bold bg-amber-100 border border-amber-200 px-3 py-1 rounded-full shadow-sm"><i class="fa-solid fa-crown mr-1"></i> 第 1 名</span>`;
                else if(idx === 1) badge = `<span class="text-slate-600 font-bold bg-slate-200 border border-slate-300 px-3 py-1 rounded-full shadow-sm">第 2 名</span>`;
                else if(idx === 2) badge = `<span class="text-orange-700 font-bold bg-orange-100 border border-orange-200 px-3 py-1 rounded-full shadow-sm">第 3 名</span>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-4 text-center">${badge}</td>
                    <td class="p-4 font-bold text-slate-800">${r.name}</td>
                    <td class="p-4 text-sm">${r.group}</td>
                    <td class="p-4 text-center"><span class="bg-slate-100 px-2 py-1 rounded font-bold">${r.count} 人</span></td>
                    <td class="p-4 text-right font-black text-emerald-600 text-xl">${r.avg}</td>
                    <td class="p-4 text-center">
                        <button class="view-score-btn text-blue-600 hover:text-white bg-blue-50 hover:bg-blue-600 border border-blue-200 px-3 py-1 rounded-lg font-bold text-sm transition" data-pid="${r.id}">
                            檢視明細
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.querySelectorAll('.view-score-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const pid = e.currentTarget.getAttribute('data-pid');
                    const r = rankArray.find(item => item.id === pid);
                    showScoreDetail(r);
                });
            });
        }

        // 顯示各評審評分明細 (Modal)
        function showScoreDetail(rankData) {
            document.getElementById('scoreModalProjName').textContent = rankData.name;
            const tbody = document.getElementById('scoreModalContent');
            tbody.innerHTML = '';
            
            rankData.detailScores.forEach(s => {
                tbody.innerHTML += `
                    <tr class="hover:bg-emerald-50/50 transition">
                        <td class="p-3 border border-slate-200 font-bold text-slate-700">${s.judgeName}</td>
                        <td class="p-3 border border-slate-200 text-center">${s.c1}</td>
                        <td class="p-3 border border-slate-200 text-center">${s.c2}</td>
                        <td class="p-3 border border-slate-200 text-center">${s.c3}</td>
                        <td class="p-3 border border-slate-200 text-center">${s.c4}</td>
                        <td class="p-3 border border-slate-200 text-center bg-emerald-50 font-bold">${s.c5}</td>
                        <td class="p-3 border border-slate-200 text-center font-black text-emerald-600 text-lg">${s.totalScore}</td>
                        <td class="p-3 border border-slate-200 text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">${s.comment || '<span class="text-slate-300">無提供評語</span>'}</td>
                    </tr>
                `;
            });
            document.getElementById('scoreDetailModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
